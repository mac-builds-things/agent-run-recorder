[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-run-recorder"
version = "0.1.0"
description = "Record, store, and replay AI agent sessions as structured JSON."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agent", "llm", "recorder", "observability"]
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["src"]
